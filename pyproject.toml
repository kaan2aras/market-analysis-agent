[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-analysis-agent"
version = "0.1.0"
description = "A market research agent for trending AI-powered mobile and web apps"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "openpyxl>=3.1.2",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
